appId: com.mysql.connection-tool
productName: MySQL连接工具
directories:
  buildResources: resources
  output: dist
publish:
  - provider: github
    owner: kk1181958464
    repo: mysql-tool
npmRebuild: false
files:
  - out/**
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/build/Release/*.node
win:
  executableName: mysql-connection-tool
  icon: resources/icon.png
  signExecutable: false
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  icon: resources/icon.png
  target:
    - dmg
    - zip
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
