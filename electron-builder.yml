appId: com.kmysql.desktop
productName: kMysql
artifactName: kMysql-${version}-${arch}.${ext}
directories:
  buildResources: resources
  output: dist
publish:
  - provider: github
    owner: kk1181958464
    repo: mysql-tool
npmRebuild: false
files:
  - out/**
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/build/Release/*.node
win:
  executableName: kMysql
  icon: resources/icon.png
  signExecutable: false
  target:
    - nsis
    - portable
nsis:
  artifactName: kMysql-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  icon: resources/icon.png
  target:
    - dmg
    - zip
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
